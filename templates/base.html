<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ nama_toko }}{% endblock %} | {{ nama_toko }}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-md navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="{{ url_for('index') }}">👕 {{ nama_toko }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#menu" aria-label="Menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('tentang') }}">Tentang</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('produk') }}">Produk</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('daftar_user') }}">Member</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('cek_username') }}">Cek Username</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('kontak') }}">Kontak</a></li>
      </ul>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    {# diisi oleh template anak #}
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-muted border-top py-3">
    &copy; 2025 {{ nama_toko }} &middot; M Zaky Sai &middot; Tugas Individu 5
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
